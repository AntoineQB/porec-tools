name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The digest must give the same answer whatever biopython is installed:
        # 1.82 is the version inside the wf-pore-c container, and 1.88 changed
        # search() at sequence boundaries. Both are exercised on every Python
        # that can run them.
        python: ["3.9", "3.11", "3.12"]
        biopython: ["1.82", "1.88"]
        exclude:
          # biopython 1.86 and later require Python >= 3.10, so this cell
          # cannot exist: pip would fail to resolve it. Python 3.9 is covered
          # by the 1.82 row, which is the version that actually matters here.
          - python: "3.9"
            biopython: "1.88"
    name: py${{ matrix.python }} / biopython ${{ matrix.biopython }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "biopython==${{ matrix.biopython }}"
          pip install -e ".[dev]"
      - name: Show versions
        run: python -c "import sys, Bio, pysam; print(sys.version); print('biopython', Bio.__version__); print('pysam', pysam.__version__)"
      - name: Lint
        run: flake8 src tests --max-line-length 88
      - name: Tests
        run: pytest -q --cov=porec_tools --cov-report=term-missing
