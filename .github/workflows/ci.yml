name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.12"]
        # the digest must be reproducible across biopython versions: 1.82 is
        # the one shipped inside wf-pore-c, 1.88 changed search() at sequence
        # boundaries. Both are exercised.
        biopython: ["1.82", "1.88"]
    name: py${{ matrix.python }} / biopython ${{ matrix.biopython }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "biopython==${{ matrix.biopython }}"
          pip install -e ".[dev]"
      - name: Lint
        run: flake8 src tests --max-line-length 88
      - name: Tests
        run: pytest -q --cov=pore_c_aqb --cov-report=term-missing
