[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "porec-tools"
dynamic = ["version"]
description = "Multi-enzyme digestion and fragment-level correction for Pore-C / CiFi concatemers. A modified pore-c-py."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Antoine Quoniam-Pasmant" }]
keywords = ["pore-c", "hi-c", "3C", "restriction", "concatemer", "nanopore", "pacbio"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Programming Language :: Python :: 3",
]
dependencies = ["pysam>=0.19", "biopython>=1.79"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "flake8"]

[project.scripts]
porec = "porec_tools.cli:main"
porec-junctions = "porec_tools.junctions:main"
porec-merge = "porec_tools.merge:main"

[project.urls]
Homepage = "https://github.com/AntoineQB/porec-tools"
Upstream = "https://github.com/epi2me-labs/pore-c-py"

[tool.setuptools.dynamic]
version = { attr = "porec_tools.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
